name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f manifest.json ]; then cp manifest.json www/; fi

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/cli@5.7.0 @capacitor/core@5.7.0 @capacitor/android@5.7.0 @capacitor/assets@3.0.5

      - name: Create Capacitor Config JSON
        run: |
          echo '{"appId":"com.accounting.app","appName":"حسابداری هوشمند ساحل","webDir":"www"}' > capacitor.config.json

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Generate Custom Icon
        run: |
          if [ -f "assets/icon.png" ]; then npx @capacitor/assets generate --android; fi

      - name: Copy Web Assets
        run: |
          npx cap copy android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Accounting-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
