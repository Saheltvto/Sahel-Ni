<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حسابداری هوشمند ساحل</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d16;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #090d16;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        .loader {
            border: 4px solid #1e293b;
            border-top: 4px solid #f59e0b;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.9s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- لودر نرم‌افزار -->
    <div id="loader-container">
        <div class="loader"></div>
        <p style="margin: 0; font-size: 0.95rem; color: #cbd5e1;">در حال بارگذاری سیستم حسابداری...</p>
    </div>

    <!-- نمایش مستقیم برنامه درون اپلیکیشن -->
    <iframe 
        id="app-frame"
        src="https://script.google.com/macros/s/AKfycbxSGw-6fRdD2m84juMlSeg00JDt84bHKaSGZue2Y4_OK5V_Hxhht8Z2wsLDvjFzPJLo/exec"
        allow="geolocation; microphone; camera"
        onload="hideLoader()">
    </iframe>

    <script>
        // مخفی کردن لودر پس از بارگذاری کامل صفحه گوگل اسکریپت
        function hideLoader() {
            const loader = document.getElementById('loader-container');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 400);
            }
        }

        // پشتیبانی از بازنشانی در صورت بروز خطا یا کندی اینترنت
        setTimeout(() => {
            hideLoader();
        }, 8000);
    </script>
</body>
</html>
